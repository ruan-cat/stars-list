name: Diagnose Pages build exit

on:
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-timeout-source:
    name: Capture VitePress Timeout source
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并捕获定时器调用源码
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 90s node --input-type=module <<'NODE'
          import { createHook } from "node:async_hooks";
          import { readFileSync } from "node:fs";

          let captured = null;
          const hook = createHook({
            init(asyncId, type, triggerAsyncId, resource) {
              if (captured || type !== "Timeout" || resource?._idleTimeout !== 100) return;

              const stack = new Error("Timeout created here").stack ?? "";
              if (!stack.includes("docs/.vitepress/.temp/app.js")) return;

              const path = "docs/.vitepress/.temp/app.js";
              const lines = readFileSync(path, "utf8").split("\n");
              const lineNumbers = [
                ...new Set(
                  [...stack.matchAll(/docs\/\.vitepress\/\.temp\/app\.js:(\d+):\d+/g)].map(
                    (match) => Number(match[1]),
                  ),
                ),
              ];

              const snippets = lineNumbers.map((lineNumber) => {
                const start = Math.max(1, lineNumber - 18);
                const end = Math.min(lines.length, lineNumber + 22);
                return {
                  lineNumber,
                  source: lines
                    .slice(start - 1, end)
                    .map((line, index) => `${start + index}: ${line}`)
                    .join("\n"),
                };
              });

              captured = { asyncId, triggerAsyncId, stack, snippets };
            },
          });
          hook.enable();

          const { build } = await import("vitepress");
          await build("docs", { base: "/stars-list/" });

          console.log("DIAG_BUILD_PROMISE_RETURNED");
          console.log("DIAG_CAPTURED_TIMEOUT", captured ? "yes" : "no");
          if (captured) {
            console.log("DIAG_TIMEOUT_STACK_BEGIN");
            console.log(captured.stack);
            console.log("DIAG_TIMEOUT_STACK_END");
            for (const snippet of captured.snippets) {
              console.log(`DIAG_SOURCE_LINE_${snippet.lineNumber}_BEGIN`);
              console.log(snippet.source);
              console.log(`DIAG_SOURCE_LINE_${snippet.lineNumber}_END`);
            }
          }

          hook.disable();
          process.exit(0);
          NODE
