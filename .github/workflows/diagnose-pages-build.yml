name: Diagnose Pages artifact upload

on:
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify-pages-artifact:
    name: Verify Pages artifact upload
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 验证 QueryClient SSR GC 策略
        run: pnpm exec tsx --test docs/.vitepress/theme/query-client.test.ts

      - name: 验证 VitePress 构建能够自然退出
        run: timeout --signal=TERM --kill-after=10s 100s pnpm run build

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传 Pages 构建工件
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./docs/.vitepress/dist"
