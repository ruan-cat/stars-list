name: Diagnose Pages build exit

on:
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-active-handles:
    name: Inspect active handles after VitePress build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并打印活动资源
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 90s node --input-type=module <<'NODE'
          import { build } from "vitepress";

          await build("docs", { base: "/stars-list/" });
          console.log("DIAG_BUILD_PROMISE_RETURNED");

          await new Promise((resolve) => setTimeout(resolve, 1000));

          console.log("DIAG_ACTIVE_RESOURCES", JSON.stringify(process.getActiveResourcesInfo()));

          const handles = process._getActiveHandles?.() ?? [];
          for (const [index, handle] of handles.entries()) {
            const info = {
              index,
              type: handle?.constructor?.name ?? typeof handle,
              hasRef: typeof handle?.hasRef === "function" ? handle.hasRef() : null,
              fd: typeof handle?.fd === "number" ? handle.fd : null,
              eventNames: typeof handle?.eventNames === "function" ? handle.eventNames() : [],
            };
            console.log("DIAG_ACTIVE_HANDLE", JSON.stringify(info));
          }

          const requests = process._getActiveRequests?.() ?? [];
          for (const [index, request] of requests.entries()) {
            console.log(
              "DIAG_ACTIVE_REQUEST",
              JSON.stringify({ index, type: request?.constructor?.name ?? typeof request }),
            );
          }

          process.exit(0);
          NODE
