name: Diagnose Pages build exit

on:
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-active-timeouts:
    name: Trace live Timeout after VitePress build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并追踪活动定时器
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 90s node --input-type=module <<'NODE'
          import { createHook } from "node:async_hooks";

          const liveTimeouts = new Map();
          const hook = createHook({
            init(asyncId, type, triggerAsyncId, resource) {
              if (type !== "Timeout") return;
              liveTimeouts.set(asyncId, {
                triggerAsyncId,
                idleTimeout: resource?._idleTimeout ?? null,
                hasRef: typeof resource?.hasRef === "function" ? resource.hasRef() : null,
                stack: new Error("Timeout created here").stack,
              });
            },
            destroy(asyncId) {
              liveTimeouts.delete(asyncId);
            },
          });
          hook.enable();

          const { build } = await import("vitepress");
          await build("docs", { base: "/stars-list/" });

          console.log("DIAG_BUILD_PROMISE_RETURNED");
          console.log("DIAG_ACTIVE_RESOURCES", JSON.stringify(process.getActiveResourcesInfo()));

          for (const [asyncId, info] of liveTimeouts.entries()) {
            console.log(
              "DIAG_LIVE_TIMEOUT",
              JSON.stringify({
                asyncId,
                triggerAsyncId: info.triggerAsyncId,
                idleTimeout: info.idleTimeout,
                hasRef: info.hasRef,
                stack: info.stack,
              }),
            );
          }

          hook.disable();
          process.exit(0);
          NODE
