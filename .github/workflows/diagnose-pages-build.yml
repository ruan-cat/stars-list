name: Diagnose Pages build exit

on:
  pull_request:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-timeout-source:
    name: Inspect VitePress Timeout source
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: 检出分支
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建并输出定时器调用源码
        shell: bash
        run: |
          timeout --signal=TERM --kill-after=10s 90s node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { build } from "vitepress";

          await build("docs", { base: "/stars-list/" });
          console.log("DIAG_BUILD_PROMISE_RETURNED");

          const path = "docs/.vitepress/.temp/app.js";
          const lines = readFileSync(path, "utf8").split("\n");

          function printAround(label, needle, before = 16, after = 28) {
            const index = lines.findIndex((line) => line.includes(needle));
            console.log(`DIAG_SOURCE_${label}_LINE`, index + 1);
            if (index < 0) return;
            const start = Math.max(0, index - before);
            const end = Math.min(lines.length, index + after + 1);
            console.log(`DIAG_SOURCE_${label}_BEGIN`);
            for (let i = start; i < end; i += 1) {
              console.log(`${i + 1}: ${lines[i]}`);
            }
            console.log(`DIAG_SOURCE_${label}_END`);
          }

          printAround("USE_WINDOW_SIZE", "function useWindowSize");
          printAround("USE_POPOVER_SIZE", "function usePopoverSize");

          console.log("DIAG_SOURCE_CALLER_BEGIN");
          for (let i = 85800; i < Math.min(lines.length, 85870); i += 1) {
            console.log(`${i + 1}: ${lines[i]}`);
          }
          console.log("DIAG_SOURCE_CALLER_END");

          process.exit(0);
          NODE
